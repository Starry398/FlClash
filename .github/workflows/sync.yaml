name: sync

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: flclash-sync
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

jobs:
  check-release:
    name: Check upstream stable release
    runs-on: ubuntu-24.04

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_build: ${{ steps.release.outputs.should_build }}

    steps:
      - name: Find latest stable upstream release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE=$(curl -fsSL \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/chen08209/FlClash/releases/latest)

          TAG=$(echo "$RELEASE" | jq -er '.tag_name')

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected upstream stable release tag: $TAG"
            exit 1
          fi

          echo "Latest upstream stable release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists in this repository."
            echo "Build and publish will be skipped."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist in this repository."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish stable release
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'

    permissions:
      contents: write
      actions: read

    uses: ./.github/workflows/shared.yaml

    with:
      source_tag: ${{ needs.check-release.outputs.tag }}
      release_tag: ${{ needs.check-release.outputs.tag }}
      release_title: ${{ needs.check-release.outputs.tag }}
      prerelease: false

    secrets: inheri