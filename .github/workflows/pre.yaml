name: Pre

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: flclash-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare pre-release version
    runs-on: ubuntu-24.04

    outputs:
      source_tag: ${{ steps.version.outputs.source_tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Calculate next pre-release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching latest stable upstream release..."

          RELEASE=$(curl -fsSL \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/chen08209/FlClash/releases/latest)

          SOURCE_TAG=$(echo "$RELEASE" | jq -er '.tag_name')

          if ! [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected upstream stable release tag: $SOURCE_TAG"
            exit 1
          fi

          BASE_VERSION="${SOURCE_TAG#v}"
          PREFIX="${BASE_VERSION}-pre."

          echo "Upstream stable tag: $SOURCE_TAG"
          echo "Base version: $BASE_VERSION"

          echo "Fetching existing releases from this repository..."

          RELEASE_TAGS=$(gh api \
            --paginate \
            "repos/${REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name')

          MAX_PRE=0

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue

            if [[ "$tag" =~ ^${BASE_VERSION//./\\.}-pre\.([0-9]+)$ ]] ||
               [[ "$tag" =~ ^v${BASE_VERSION//./\\.}-pre\.([0-9]+)$ ]]; then
              NUMBER="${BASH_REMATCH[1]}"
              NUMBER=$((10#$NUMBER))

              if (( NUMBER > MAX_PRE )); then
                MAX_PRE=$NUMBER
              fi
            fi
          done <<< "$RELEASE_TAGS"

          NEXT_PRE=$((MAX_PRE + 1))
          VERSION_NAME="${PREFIX}${NEXT_PRE}"
          RELEASE_TAG="v${VERSION_NAME}"
          RELEASE_TITLE="$RELEASE_TAG"

          echo "Previous highest pre-release number: $MAX_PRE"
          echo "Next Android versionName: $VERSION_NAME"
          echo "Release title: $RELEASE_TITLE"
          echo "Release tag: $RELEASE_TAG"

          if gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists: $RELEASE_TAG"
            exit 1
          fi

          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish pre-release
    needs: prepare

    permissions:
      contents: write
      actions: read

    uses: ./.github/workflows/shared.yaml

    with:
      source_tag: ${{ needs.prepare.outputs.source_tag }}
      version_name: ${{ needs.prepare.outputs.version_name }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      release_title: ${{ needs.prepare.outputs.release_title }}
      prerelease: true

    secrets: inherit