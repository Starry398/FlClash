name: pre

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: flclash-pre
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

jobs:
  check-release:
    name: Check upstream prerelease
    runs-on: ubuntu-24.04

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_build: ${{ steps.release.outputs.should_build }}

    steps:
      - name: Find latest upstream prerelease
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASES=$(curl -fsSL \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/chen08209/FlClash/releases?per_page=100")

          TAG=$(echo "$RELEASES" | jq -r '
            [
              .[]
              | select(.prerelease == true)
              | select(.draft == false)
              | select(
                  .tag_name
                  | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-pre\\.[0-9]+$")
                )
            ]
            | sort_by(.published_at)
            | last
            | .tag_name // empty
          ')

          if [[ -z "$TAG" ]]; then
            echo "No matching upstream prerelease was found."
            echo "Expected tag format: v0.9.2-pre.1"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest upstream prerelease: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists in this repository."
            echo "Build and publish will be skipped."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist in this repository."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish prerelease
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'

    permissions:
      contents: write
      actions: read

    uses: ./.github/workflows/shared.yaml

    with:
      source_tag: ${{ needs.check-release.outputs.tag }}
      release_tag: ${{ needs.check-release.outputs.tag }}
      release_title: ${{ needs.check-release.outputs.tag }}
      prerelease: true

    secrets: inherit